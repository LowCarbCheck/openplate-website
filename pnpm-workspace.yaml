allowBuilds:
  esbuild: true

# Restrict optional native deps to the build/deploy target arch. The
# package.json `pnpm` field is not read by pnpm 11 at all, so this belongs here.
supportedArchitectures:
  os:
    - linux
  cpu:
    - x64

# Supply-chain hardening: a published version must be at least 7 days old before
# pnpm will resolve it. pnpm 11's own default is 1440 minutes (24h); this widens
# that to a week, which is the window in which a compromised release is normally
# spotted and yanked.
#
# Only affects RESOLUTION (adding/updating deps). `--frozen-lockfile` installs,
# which is what CI and every container build runs, are unaffected.
minimumReleaseAge: 10080
