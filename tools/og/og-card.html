<!doctype html>
<!--
  The source of `public/og.png`, rendered once at 1200x630 and committed as a
  PNG. It is a local file on purpose: no image service, no build-time render,
  and nothing to break in CI. Re-render it with:

    agent-browser open file://$PWD/tools/og/og-card.html
    agent-browser viewport 1200x630
    agent-browser screenshot public/og.png
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fraunces';
        src: url('../../public/fonts/fraunces-latin-var.woff2') format('woff2');
        font-weight: 300 700;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: hsl(192 34% 96%);
        color: hsl(200 18% 8%);
        font-family: 'Inter', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        padding: 0 96px;
        box-sizing: border-box;
      }
      .mark {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 92px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: hsl(179 92% 25%);
      }
      .line {
        width: 96px;
        height: 4px;
        background: hsl(179 92% 25%);
        border-radius: 2px;
      }
      .tagline {
        font-size: 40px;
        line-height: 1.3;
        max-width: 900px;
      }
      .foot {
        font-size: 26px;
        color: hsl(197 14% 38%);
      }
    </style>
  </head>
  <body>
    <div class="mark">openplate</div>
    <div class="line"></div>
    <div class="tagline">An open-source food diary that runs on your device.</div>
    <div class="foot">openplate.de</div>
  </body>
</html>
