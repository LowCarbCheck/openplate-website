# One canonical host: openplate.de.
#
# Traefik routes openplate.de and www.openplate.de at this container and has no redirect
# middleware, so the www -> apex 301 belongs here. Same arrangement as collie, selfhostedworld
# and nicotinepouch.
#
# This host also used to serve the openplate app itself. The app moved to beta.openplate.de,
# but mailed invite links, bookmarks and installed PWAs still carry the old openplate.de paths
# (/join, /sign-in, /dashboard, and so on). Bay cannot redirect those either, so the openplate.de
# server block below carries a 301 for each old app path, straight through to the new host, path
# and query intact.

# Anything that is not a named host: www.openplate.de lands here, and so does Traefik's health
# check, which addresses the container by IP.
server {
    listen 80 default_server;
    server_name _;

    # Answered instead of redirected. Traefik addresses the container by IP, so its health
    # check lands on this server, and a check that gets a 301 is measuring the redirect, not
    # the server it is meant to be checking.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The redirect lives in a location, not in the server block. A server-level `return` runs
    # in the rewrite phase, before nginx picks a location, so it would swallow /healthz above.
    location / {
        return 301 https://openplate.de$request_uri;
    }
}

server {
    listen 80;
    server_name openplate.de;

    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers. Without these two, nginx's own directory-slash redirect (the
    # one try_files falls back to below) would answer with an absolute http://openplate.de/...
    # URL and the host's own port, which is wrong behind Traefik's TLS termination.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Old app paths. The app that used to live here moved to beta.openplate.de; these keep the
    # full path and query so an old invite link or a bookmark still lands on the right screen.
    #
    # `^~` so a prefix match here wins outright over the regex-free `location /` below, without
    # nginx falling through to a longer regex match first. None of these prefixes collide with a
    # real site path (/, /app/, /sync/, /inference/, /docs/, /releases/, /privacy/, /imprint/,
    # /de/, /assets/, /SOURCE.json, /sitemap.xml, /robots.txt, /favicon.ico, /fonts/) confirmed
    # against build/client after a build. /app is deliberately NOT in this list: on this site it
    # is the app's own description page, and must stay here rather than redirect away.
    location ^~ /join { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /sign-in { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /sign-up { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /forgot { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /reset { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /admin { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /diary { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /dashboard { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /settings { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /scan { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /onboarding { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /export { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /history { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /goals { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /weight { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /legal { return 301 https://beta.openplate.de$request_uri; }
    location ^~ /healthcheck { return 301 https://beta.openplate.de$request_uri; }
    location = /manifest.webmanifest { return 301 https://beta.openplate.de$request_uri; }
    location = /sw.js { return 301 https://beta.openplate.de$request_uri; }

    # Vite fingerprints everything under /assets/, so the content of a given URL never changes.
    # Cache it for a year; a deploy changes the name, not the file.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every prerendered page is a directory with its own index.html, so a request for the
    # directory serves it, and a request for the bare path falls through to nginx's normal
    # directory-slash redirect (301, made relative by absolute_redirect/port_in_redirect above).
    # Everything else not fingerprinted gets a short cache: long enough to take some load off
    # a deploy, short enough that a fix goes out within five minutes.
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ =404;
    }
}
