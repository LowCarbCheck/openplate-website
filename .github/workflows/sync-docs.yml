# Re-quote openplate's documentation on this site, and translate what changed.
#
# ── THE ONLY WRITER OF THE GENERATED DOCS ──
# `src/generated/` is written here and nowhere else in CI. Two reasons, and the
# second is the hard one:
#
#   * Committing generated output was meant to put "what this site CLAIMS
#     openplate does" through code review. A bot commit skips that review. The
#     trade is accepted: the review happened in the source repository when the
#     docs merged, and one person owns all four.
#   * Translation is NOT DETERMINISTIC. Ask twice, get two different German
#     sentences, both correct. If a laptop and this job both write the memory,
#     the diff is two good translations of one sentence and nobody can
#     adjudicate it. `translate-docs.ts` refuses to write outside CI for exactly
#     this reason.
#
# ── WHY THIS PUSHES WITH A PAT ──
# A push made with the default `GITHUB_TOKEN` does not trigger workflows. That
# is GitHub's loop guard, and it would mean no gate ever runs on anything this
# job commits, and no deploy on the one commit that changed what readers see.
#
# ── WHY THE SCHEDULE EXISTS EVEN THOUGH THE THREE REPOS DISPATCH ──
# A dispatch can be missed: the token expires, a run is cancelled, a release is
# cut by hand. A daily pass heals that within 24 hours. It also keeps this
# repository active, which matters, GitHub disables a scheduled workflow after
# 60 days of inactivity, and a project site can be quiet that long.
name: Sync docs

on:
  # Fired by release-image.yml in openplate, openplate-core and
  # openplate-inference, with the repository and the tag they just published.
  repository_dispatch:
    types: [openplate-released]
  # 06:41, not on the hour: the hour is when every scheduled workflow on GitHub
  # queues at once and a run can wait tens of minutes for a runner.
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Spend ceiling in USD for the whole run, all locales together'
        default: '0.25'
      app_ref:
        description: 'An openplate ref to sync instead of its highest tag'
        default: ''
      sync_ref:
        description: 'An openplate-core ref to sync instead of its highest tag'
        default: ''
      inference_ref:
        description: 'An openplate-inference ref to sync instead of its highest tag'
        default: ''

# Never two at once, and never cancel one mid-flight: a cancelled run has
# already paid for the sentences it bought, and they are only saved at the end
# of each chunk. Two dispatches, one per repository released minutes apart,
# queue and the second sees the first one's tree.
concurrency:
  group: sync-docs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PAT, not GITHUB_TOKEN. See the header.
          token: ${{ secrets.OPENPLATE_WEBSITE_PUSH_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── THE DIAGRAMS NEED A BROWSER, AND THIS RUNNER ALREADY HAS ONE ──
      # Mermaid has no renderer that is not a browser, so `sync:docs` starts one
      # to draw a fence that changed, and `tests/unit/mermaid.test.ts` starts one
      # to check that it draws. Neither found one here until now.
      #
      # WHERE THAT HID IS WORSE THAN THE RED TICK IT CAUSED. `renderDiagrams`
      # only starts a browser when a drawing's stamp has moved, so on 2026-09-07
      # run 34099274684 the sync step passed with "27 drawings, all already
      # drawn" while the unit tier went red on `no chromium found`. The sync
      # itself would have failed at the first changed fence upstream, which is
      # the one moment this job exists for.
      #
      # No download and no new dependency: `ubuntu-latest` ships Google Chrome,
      # and `searchForBrowser` in scripts/lib/mermaid.ts finds it on PATH. This
      # step exports the answer once, so the two steps below share it and the
      # test skips nothing here.
      #
      # IT FAILS LOUDLY WHEN IT FINDS NOTHING, and never falls through: a run
      # that quietly drew no diagrams and reported success is exactly the state
      # this step exists to end. `findBrowser` names every path and command it
      # tried in its message, so the log says what to install.
      - name: Point the renderer at a browser
        run: |
          set -euo pipefail
          chrome="$(node --import tsx --input-type=module \
            -e "import { findBrowser } from './scripts/lib/mermaid.ts'; console.log(findBrowser());")"
          echo "OPENPLATE_CHROME=$chrome" >> "$GITHUB_ENV"
          echo "the diagrams will be drawn with $chrome"

      - name: Re-quote the three repositories' docs
        env:
          # ── THE DISPATCH DOES NOT CHOOSE THE REF, AND THAT IS DELIBERATE ──
          # A release job could hand us the tag it just cut, and it sends it for
          # the record. Using it would put "which release does the site
          # document" in two places: here, and `highestTag` in sync-docs.ts,
          # which takes the highest vX.Y.Z tag. They would agree until the day
          # they did not, a prerelease, or a hotfix published on an older line
          # after a newer major.
          #
          # ALL THREE SOURCES EVERY RUN, whichever one was released. A dispatch
          # missed for one repository is then healed by the next repository's
          # release, or by the daily pass. The payload says only WHY this run
          # exists.
          #
          # Empty on a dispatch and on a schedule. The workflow_dispatch inputs
          # are the one override, for a docs-only fix that cannot wait for a
          # release.
          OPENPLATE_APP_REF: ${{ inputs.app_ref }}
          OPENPLATE_SYNC_REF: ${{ inputs.sync_ref }}
          OPENPLATE_INFERENCE_REF: ${{ inputs.inference_ref }}
        run: pnpm run sync:docs

      # ── ONE PASS PER LANGUAGE, AND THE BUDGET IS PER LANGUAGE TOO ──
      # `translate-docs.ts` takes one `--locale` on purpose; the note at the top
      # of it says why, and the short version is that a shared budget, a shared
      # exit code and a shared partial write across two unrelated corpora means
      # a French outage stops the German pass from saving what it bought. So the
      # loop is here.
      #
      # THE CONSEQUENCE IS WRITTEN DOWN RATHER THAN HIDDEN: `budget` is the
      # ceiling for ONE language, so the most this step can spend is that number
      # times the number of languages. At the default that is 2 x $0.25 = $0.50.
      # A run that pays anything like that is a first corpus or a re-segmentation,
      # never a release, and the per-locale numbers below say which locale it was.
      #
      # The list comes from `app/i18n/language.ts` and not from a line in this
      # file. A third language must not need a workflow edit to be translated,
      # because the edit that would be forgotten is exactly this one, and what it
      # ships is a language whose pages are silently English.
      - name: Translate what changed, one language at a time
        id: translate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +e
          locales=$(node --import tsx --input-type=module \
            -e "import { TRANSLATED_LANGUAGES } from './app/i18n/language.ts'; console.log(TRANSLATED_LANGUAGES.join(' '));")
          if [ -z "$locales" ]; then
            echo "could not read the language list" >&2
            exit 1
          fi
          : > "$RUNNER_TEMP/translate.log"
          worst=0
          for locale in $locales; do
            echo "── $locale ──" | tee -a "$RUNNER_TEMP/translate.log"
            pnpm run translate:docs --locale "$locale" --budget "${{ inputs.budget || '0.25' }}" \
              | tee -a "$RUNNER_TEMP/translate.log"
            code=${PIPESTATUS[0]}
            echo "translate:docs --locale $locale exited $code" | tee -a "$RUNNER_TEMP/translate.log"
            # 2 is "refused on cost". The English docs above are correct and
            # current and still worth shipping; only the translation waits for
            # someone to approve the number. Anything else non-zero is a real
            # break and stops the job here.
            #
            # A REFUSAL ON ONE LANGUAGE DOES NOT STOP THE NEXT ONE. They are
            # separate corpora and separate files: a French rebuild that nobody
            # has approved yet is no reason to leave the German page quoting a
            # release it no longer tracks.
            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
              echo "code=$code" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ "$code" -eq 2 ]; then worst=2; fi
          done
          echo "code=$worst" >> "$GITHUB_OUTPUT"

      # ── DRAW AGAIN, BECAUSE A LABEL BOUGHT ABOVE IS STILL DRAWN IN ENGLISH ──
      # The step two above this one DRAWS the diagrams, and the step above it
      # BUYS the words. In that order a label first translated by this run is
      # rendered by the next run, whenever that happens to be, and until then
      # the German page carries an English picture.
      #
      # THIS IS WHAT SHIPPED. Commit `032d409`, "re-quote openplate at v0.11.1",
      # added six drawings of the one diagram whose label had moved, and four of
      # them, German and French, light and dark, read "Configured food data"
      # under a paragraph that translates the phrase. The English pair was
      # right, which is why nothing looked broken from here.
      #
      # It is not the fallback that is wrong. `translateDiagram` returns null
      # for a fence whose labels are not all bought, and the whole fence then
      # falls back to English, because a half German flowchart reads as a bug
      # while an English one reads as untranslated. M197/10 chose that and it
      # stays. What was missing is the pipeline coming back afterwards.
      #
      # WHY A SECOND PASS AND NOT A REORDER. `translate-docs.ts` reads the
      # parsed tree that `sync:docs` writes, so the sync has to run first. There
      # is no order of these two steps that draws a freshly bought label; there
      # is only drawing again.
      #
      # AND IT COSTS NOTHING WHEN NOTHING MOVED. Every SVG carries a stamp of
      # the palette, the mermaid version and a hash of the WORDS in it, so this
      # pass redraws exactly the diagrams whose labels the step above bought and
      # skips the rest without starting a browser. On a run that bought nothing
      # it prints "all already drawn" and ends. On a run that bought something
      # it names each diagram it redrew, so the log says what the second pass
      # was for.
      #
      # The refs are repeated from the first pass deliberately. Left empty, this
      # pass would resolve the highest tag afresh, and a release cut during the
      # minutes the translator was running would put one repository at a
      # different ref from the one the docs above were quoted at.
      #
      # `tests/unit/sync-workflow-order.test.ts` pins the ordering, so moving
      # the translation back above the drawing is a red run and not a quiet
      # shipment of English labels.
      - name: Draw again, now that the labels are bought
        env:
          OPENPLATE_APP_REF: ${{ inputs.app_ref }}
          OPENPLATE_SYNC_REF: ${{ inputs.sync_ref }}
          OPENPLATE_INFERENCE_REF: ${{ inputs.inference_ref }}
        run: pnpm run sync:docs

      # The repo's own gate, tier by tier. There is no `check` script: the
      # pre-push hook runs these four, and this job runs the same four so that
      # what a laptop refuses to push, this job refuses to commit.
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run build

      - name: Commit
        id: commit
        run: |
          set -euo pipefail
          paths="src/generated public/SOURCE.json"
          # Named once because the recovery below treats it differently from
          # every other generated path: it is unioned rather than replaced.
          memory="src/generated/docs-i18n"
          # `set -e` and a bare `[ ... ] && ...` do not mix: a false test is a
          # non-zero status and would end the step here, silently, without a
          # commit. Written as an `if` for that reason alone.
          if [ -d public/docs ]; then paths="$paths public/docs"; fi
          if [ -z "$(git status --porcelain $paths)" ]; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "Nothing moved. The docs are already quoted correctly." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=1" >> "$GITHUB_OUTPUT"

          # WHICH REPOSITORY AND WHICH TAG, for the subject line only. The
          # dispatch payload names the release that woke this run; a scheduled
          # or manual run has no payload, so the subject is built from the refs
          # the sync actually resolved.
          repo='${{ github.event.client_payload.repo }}'
          tag='${{ github.event.client_payload.tag }}'
          if [ -n "$repo" ] && [ -n "$tag" ]; then
            subject="chore(docs): re-quote $repo at $tag"
          else
            subject="chore(docs): re-quote $(jq -r '[to_entries[] | "\(.key) at \(.value.ref)"] | join(", ")' src/generated/SOURCE.json)"
          fi

          git config user.name "openplate-docs-bot"
          git config user.email "partners@sportsight.de"
          # `git add`, never `-A`: this job owns the generated tree and nothing
          # else. For a tracked path it still stages deletions, which is how a
          # guide removed upstream stops being published.
          git add $paths
          git commit -m "$subject"
          # THE COMMIT THE GATE ABOVE RAN ON. Every recovery below reapplies
          # this tree rather than merging into it, so the name is worth having.
          # It moves only when a recovery makes a new commit out of the same
          # generation.
          run_commit="$(git rev-parse HEAD)"

          # ── TWO SEAMS, BOTH FOR tests/unit/sync-commit-recovery.test.ts ──
          # That test extracts this very block out of this file and runs it
          # against two clones of a throwaway repository, because a retry loop
          # that looks right and cannot retry is exactly what shipped on
          # 2026-09-07. It overrides the merge command because its clones are in
          # /tmp with no node_modules, and it overrides the pause so that the
          # case which exhausts all three attempts costs no wall clock. Neither
          # variable is ever set in this workflow.
          merge_memory="${MERGE_MEMORY:-node --import tsx scripts/merge-memory.ts}"
          pause="${RETRY_PAUSE:-5}"

          # One locale file per line of a commit's `src/generated/docs-i18n/`,
          # copied out to a directory. A commit that carries no memory at all
          # leaves an empty directory, which the union reads as an empty side.
          # Unquoted on purpose, twice over: `$(git ls-tree ...)` is one path
          # per line and locale file names carry no spaces, and `$merge_memory`
          # below is a command with its arguments rather than one word.
          export_memory() {
            for path in $(git ls-tree -r --name-only "$1" -- "$memory"); do
              git show "$1:$path" > "$2/$(basename "$path")"
            done
          }

          # ── WHY THIS IS NOT `git pull --rebase` IN A LOOP ANY MORE ──
          # It was, and it could not retry. On 2026-09-07 run 34096862439
          # conflicted on `public/SOURCE.json`, `src/generated/SOURCE.json` and
          # `src/generated/docs-i18n/de.json`, and left the tree mid rebase.
          # There was no abort, so attempts 2 and 3 both died on `error: Pulling
          # is not possible because you have unmerged files` and the step exited
          # 1. One conflict poisoned all three passes. Nothing was lost only
          # because a person merged the same content by hand.
          #
          # `fetch` plus `rebase` rather than `pull` so that the recovery can
          # name `origin/main` as a commit. `pull` also refuses outright while
          # unmerged files exist, which is the trap above.
          #
          # SKIP_TESTS=1 is the hook's own escape hatch, and here it is the
          # right one: `pnpm install` ran the `prepare` script, which pointed
          # core.hooksPath at .githooks, and the pre-push gate refuses to run
          # without the ts-dev toolbox (it failed every push of this job on
          # 2026-09-04). The tiers it would run, lint, typecheck, unit tests,
          # staleness and build, are the steps above this one. The push itself
          # re-runs them on the pushed commit, which is the reason for the PAT.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              # ── ABORTING IS NECESSARY AND NOT SUFFICIENT ──
              # Without this line the next attempt cannot even start. With it
              # and nothing else, the next attempt conflicts again on the same
              # files for the same reason, forever: both runs regenerate the
              # WHOLE tree, so their outputs differ wherever the three source
              # repositories moved, and git has no way to know that one of them
              # is simply newer.
              #
              # So the resolution is the one a person would reach for, and did
              # on 2026-09-07: throw the merge away, take the branch, and
              # reapply this run's generation on top of it. Every run re-quotes
              # all three repositories, so a run's own output is always a
              # complete, current sync and never a partial one. A text merge of
              # two generations is the one result that is wrong either way:
              # docs synced at one tag beside a `SOURCE.json` from another.
              echo "::notice::attempt ${attempt}: the branch moved and the generated tree conflicted. Regenerating onto it."
              git rebase --abort || true
              git reset --hard origin/main

              # ── NO `--ours` AND NO `--theirs`, ON PURPOSE ──
              # During a rebase those two are INVERTED against every intuition:
              # `--ours` is the upstream being replayed onto and `--theirs` is
              # the commit being replayed, because the rebase checks out the
              # upstream first and replays your work onto it. Proven on
              # 2026-09-07 rather than reasoned: in a throwaway repository where
              # the upstream held UPSTREAM and the replayed commit held MINE,
              # `git checkout --ours` produced UPSTREAM and `git checkout
              # --theirs` produced MINE. A flag whose meaning flips with the
              # command that is running has no place in a rule that decides
              # which of two trees the site publishes, so both commits are named
              # outright instead.
              branch_memory="$(mktemp -d)"
              run_memory="$(mktemp -d)"
              export_memory origin/main "$branch_memory"
              export_memory "$run_commit" "$run_memory"

              # `git rm` first, then `git checkout`: a checkout restores what
              # the named commit has and says nothing about what it does not.
              # Without the removal, a guide deleted upstream and still present
              # on the branch would quietly survive the recovery and go on being
              # published.
              git rm -r --quiet --ignore-unmatch -- $paths
              git checkout "$run_commit" -- $paths

              # ── THE ONE FILE THAT IS NOT REGENERATED, BECAUSE IT IS BOUGHT ──
              # The memory is a record of sentences a model was PAID to
              # translate. Taking this run's copy whole would drop what the
              # other run bought minutes earlier and the next run would buy it
              # again. `scripts/merge-memory.ts` unions the two sides and keeps
              # this run's value where both hold a key; its own test pins that,
              # because a merge rule that can lose money deserves a case.
              $merge_memory --branch "$branch_memory" --run "$run_memory" --out "$memory"
              git add $paths

              # ── STILL REFUSES TO PUSH A TREE ITS GATE HAS NOT SEEN ──
              # The lint, typecheck, test and build steps above ran on
              # `$run_commit`. Everything staged here has to be that same tree,
              # the translation memory excepted and named. This is a tripwire
              # rather than a likely failure: it is what turns a future edit
              # that starts merging text in here into a red run instead of a
              # published tree nobody gated.
              if ! git diff --cached --quiet "$run_commit" -- $paths ":(exclude)$memory"; then
                echo "::error::the resolved tree differs from the one the gate ran on, outside the translation memory. Refusing to push." >&2
                exit 1
              fi
              # A recovery can end with nothing to stage: the branch already
              # carries exactly this generation. The usual twin dispatch never
              # gets this far, because the rebase drops a commit whose patch is
              # already applied and the push is then a no-op, which the recovery
              # test records. This is here so that the case which does arrive
              # exits green instead of dying on `git commit`'s "nothing to
              # commit" under `set -e`.
              if git diff --cached --quiet; then
                echo "The branch already carries this generation. Nothing to push." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              git commit --quiet -m "$subject"
              run_commit="$(git rev-parse HEAD)"
            fi
            if SKIP_TESTS=1 git push origin HEAD:main; then exit 0; fi
            sleep "$pause"
          done
          # LOUD, AND IT NAMES WHAT IT LOST TO. A step that just exits 1 sends
          # whoever reads the run to guess between a token, a protected branch
          # and a race. The sha and subject below say which of those it was.
          echo "::error::Could not land the re-quoted docs after 3 attempts. origin/main is now $(git rev-parse --short origin/main) \"$(git log -1 --format=%s origin/main)\"." >&2
          exit 1

      # ── CLOSE THE LOOP ──
      # The push above goes into a deploy system that is known to stall
      # SILENTLY (Bay: memory `project_bay_pull_deploy_stale_image_trap`), and
      # there is no human watching it. `SOURCE.json` is served by the site
      # itself and records the three commits its pages were generated from, so
      # asking the running site for it is the one check that distinguishes
      # "deployed" from "the build queue quietly stopped".
      #
      # THE ORIGIN IS A REPOSITORY VARIABLE, not a constant, because the site is
      # not on Bay yet. Until M194 sets `vars.OPENPLATE_WEBSITE_ORIGIN` there is
      # nothing to poll, and this step says so and passes: an unrolled-out
      # commit is not a broken one while there is no rollout.
      #   gh variable set OPENPLATE_WEBSITE_ORIGIN --body https://openplate.de
      - name: Wait for the deploy to carry the new commit
        if: steps.commit.outputs.changed == '1'
        env:
          SITE_ORIGIN: ${{ vars.OPENPLATE_WEBSITE_ORIGIN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_ORIGIN:-}" ]; then
            echo "::notice::No OPENPLATE_WEBSITE_ORIGIN set, so there is no live site to poll. The commit is pushed. Set the variable when the site is on Bay (M194)."
            exit 0
          fi
          want="$(jq -Sc '[.app.commit, .sync.commit, .inference.commit]' src/generated/SOURCE.json)"
          echo "waiting for ${SITE_ORIGIN} to serve ${want}"
          # 30 MINUTES. Bay builds the image and rolls it out as two steps, and
          # the gap between them is not small. A false alarm here is worse than
          # a slow job, because the whole point of the step is that a red run
          # means something.
          for attempt in $(seq 1 60); do
            live="$(curl -fsS --max-time 10 "${SITE_ORIGIN}/SOURCE.json" 2>/dev/null | jq -Sc '[.app.commit, .sync.commit, .inference.commit]' 2>/dev/null || true)"
            if [ "$live" = "$want" ]; then
              echo "${SITE_ORIGIN} is serving the new commits after $((attempt * 30))s"
              exit 0
            fi
            # LOGGED, because a silent poll gives no way to tell a stalled
            # deploy from a checker that cannot read the answer. If this prints
            # `nothing` for the whole window, suspect a CrowdSec ban on the
            # runner before suspecting Bay (memory: the probe trips CrowdSec).
            [ $((attempt % 5)) -eq 1 ] && echo "  attempt ${attempt}: serving ${live:-nothing}"
            sleep 30
          done
          echo "::error::30 minutes after the push, ${SITE_ORIGIN} is still not serving ${want}." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Sync docs"
            echo
            echo "Triggered by \`${{ github.event_name }}\`${{ github.event.client_payload.tag && format(', after {0} {1}', github.event.client_payload.repo, github.event.client_payload.tag) || '' }}."
            echo
            echo '```'
            cat "$RUNNER_TEMP/translate.log" 2>/dev/null || echo "(the translator did not run)"
            echo '```'
            if [ "${{ steps.translate.outputs.code }}" = "2" ]; then
              echo
              echo "### Refused on cost"
              echo
              echo "The English docs were committed. The translation was not."
              echo "Approve it by running this workflow again with a higher \`budget\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # LAST, so the commit above still happens. Over budget is a red run that
      # the operator clears with one click, not a reason to leave the site
      # quoting a release it no longer tracks.
      - name: Fail if the translation was refused on cost
        if: steps.translate.outputs.code == '2'
        run: |
          echo "translate:docs refused the spend. English shipped; the translation is waiting." >&2
          exit 1
